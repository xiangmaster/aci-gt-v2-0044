name: Issue Triage (Models)
on:
  issues:
    types:
    - opened
permissions:
  issues: write
  models: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  triage:
    if: ${{ github.repository == 'xiangmaster/aci-gt-v2-0044' && 
      github.event.issue.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
    - name: Detect spam or low-quality content
      uses: actions/ai-inference@v2
      id: quality
      continue-on-error: true
      with:
        max-tokens: 20
        prompt: "Is this GitHub issue spam, AI-generated slop, or low quality?\n\n\
          Title: ${{ github.event.issue.title }}\nBody: ${{ github.event.issue.body
          }}\n\nRespond with exactly one of: spam, ai-generated, needs-review, ok\n"
        system-prompt: You detect spam and low-quality contributions. Be 
          conservative - only flag obvious spam or AI slop.
        model: openai/gpt-4o-mini
    - name: Apply quality label if needed
      if: steps.quality.outputs.response != '' && steps.quality.outputs.response
        != 'ok'
      uses: actions/github-script@v9
      env:
        QUALITY_LABEL: ${{ steps.quality.outputs.response }}
      with:
        script: "const label = (process.env.QUALITY_LABEL || '').trim().toLowerCase();\n\
          const labelMeta = {\n  'spam': { color: 'd73a4a', description: 'Possible
          spam' },\n  'ai-generated': { color: 'fbca04', description: 'Possible AI-generated
          low-quality content' },\n  'needs-review': { color: 'f9d0c4', description:
          'Needs human review' },\n};\nconst meta = labelMeta[label];\nif (!meta)
          return;\n\n// Ensure label exists\ntry {\n  await github.rest.issues.getLabel({
          owner: context.repo.owner, repo: context.repo.repo, name: label });\n} catch
          (e) {\n  if (e.status !== 404) throw e;\n  await github.rest.issues.createLabel({
          owner: context.repo.owner, repo: context.repo.repo, name: label, color:
          meta.color, description: meta.description });\n}\n\n// Apply label\nawait
          github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo,
          issue_number: context.payload.issue.number, labels: [label] });\n\n// Set
          output to skip remaining steps\ncore.setOutput('is_spam', 'true');\n"
    - name: Detect duplicate issues
      if: steps.quality.outputs.response == 'ok' || 
        steps.quality.outputs.response == ''
      uses: 
        pelikhan/action-genai-issue-dedup@bdb3b5d9451c1090ffcdf123d7447a5e7c7a2528
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Determine if completeness check should be skipped
      if: steps.quality.outputs.response == 'ok' || 
        steps.quality.outputs.response == ''
      uses: actions/github-script@v9
      id: check-skip
      with:
        script: "const title = (context.payload.issue.title || '').toLowerCase();\n\
          const labels = (context.payload.issue.labels || []).map(label => label.name);\n\
          const hasFeatureRequest = title.includes('feature request');\nconst hasEnhancement
          = labels.includes('enhancement');\nconst shouldSkip = hasFeatureRequest
          && hasEnhancement;\ncore.setOutput('should_skip', shouldSkip ? 'true' :
          'false');\n"
    - name: Analyze issue completeness and determine labels
      if: (steps.quality.outputs.response == 'ok' || 
        steps.quality.outputs.response == '') && 
        steps.check-skip.outputs.should_skip != 'true'
      uses: actions/ai-inference@v2
      id: analysis
      continue-on-error: true
      with:
        prompt: "Analyze this GitHub issue for completeness and determine if it needs
          labels.\n\nIMPORTANT: Distinguish between:\n- Device/firmware bugs (crashes,
          reboots, lockups, radio/GPS/display/power issues) - these need device logs\n\
          - Build/release/packaging issues (missing files, CI failures, download problems)
          - these do NOT need device logs\n- Documentation or website issues - these
          do NOT need device logs\n\nIf this is a device/firmware bug, request device
          logs and explain how to get them:\n\nWeb Flasher logs:\n- Go to https://flasher.meshtastic.org\n\
          - Connect the device via USB and click Connect\n- Open the device console/log
          output, reproduce the problem, then copy/download and attach/paste the logs\n\
          \nMeshtastic CLI logs:\n- Run: meshtastic --port <serial-port> --noproto\n\
          - Reproduce the problem, then copy/paste the terminal output\n\nAlso request
          key context if missing: device model/variant, firmware version, region,
          steps to reproduce, expected vs actual.\n\nRespond ONLY with valid JSON
          (no markdown, no code fences):\n{\"complete\": true, \"comment\": \"\",
          \"label\": \"none\"}\nOR\n{\"complete\": false, \"comment\": \"Your helpful
          comment\", \"label\": \"needs-logs\"}\n\nUse \"needs-logs\" ONLY if this
          is a device/firmware bug AND no logs are attached.\nUse \"needs-info\" if
          basic info like firmware version or steps to reproduce are missing.\nUse
          \"none\" if the issue is complete, is a feature request, or is a build/CI/packaging
          issue.\n\nTitle: ${{ github.event.issue.title }}\nBody: ${{ github.event.issue.body
          }}\n"
        system-prompt: You are a helpful assistant that triages GitHub issues. 
          Be conservative with labels. Only request device logs for actual 
          device/firmware bugs, not for build/release/CI issues.
        model: openai/gpt-4o-mini
    - name: Process analysis result
      if: (steps.quality.outputs.response == 'ok' || 
        steps.quality.outputs.response == '') && 
        steps.check-skip.outputs.should_skip != 'true' && 
        steps.analysis.outputs.response != ''
      uses: actions/github-script@v9
      id: process
      env:
        AI_RESPONSE: ${{ steps.analysis.outputs.response }}
      with:
        script: "let raw = (process.env.AI_RESPONSE || '').trim();\n\n// Strip markdown
          code fences if present\nraw = raw.replace(/^```(?:json)?\\s*/i, '').replace(/\\
          s*```$/i, '').trim();\n\nlet complete = true;\nlet comment = '';\nlet label
          = 'none';\n\ntry {\n  const parsed = JSON.parse(raw);\n  complete = !!parsed.complete;\n\
          \  comment = (parsed.comment ?? '').toString().trim();\n  label = (parsed.label
          ?? 'none').toString().trim().toLowerCase();\n} catch {\n  // If JSON parse
          fails, log warning and don't comment (avoid posting raw JSON)\n  console.log('Failed
          to parse AI response as JSON:', raw);\n  complete = true;\n  comment = '';\n\
          \  label = 'none';\n}\n\n// Validate label\nconst allowedLabels = new Set(['needs-logs',
          'needs-info', 'none']);\nif (!allowedLabels.has(label)) label = 'none';\n\
          \n// Only comment if we have a valid parsed comment (not raw JSON)\nconst
          shouldComment = !complete && comment.length > 0 && !comment.startsWith('{');\n\
          core.setOutput('should_comment', shouldComment ? 'true' : 'false');\ncore.setOutput('comment_body',
          comment);\ncore.setOutput('label', label);\n"
    - name: Apply triage label
      if: steps.process.outputs.label != '' && steps.process.outputs.label != 
        'none'
      uses: actions/github-script@v9
      env:
        LABEL_NAME: ${{ steps.process.outputs.label }}
      with:
        script: "const label = process.env.LABEL_NAME;\nconst labelMeta = {\n  'needs-logs':
          { color: 'cfd3d7', description: 'Device logs requested for triage' },\n\
          \  'needs-info': { color: 'f9d0c4', description: 'More information requested
          for triage' },\n};\nconst meta = labelMeta[label];\nif (!meta) return;\n\
          \n// Ensure label exists\ntry {\n  await github.rest.issues.getLabel({ owner:
          context.repo.owner, repo: context.repo.repo, name: label });\n} catch (e)
          {\n  if (e.status !== 404) throw e;\n  await github.rest.issues.createLabel({
          owner: context.repo.owner, repo: context.repo.repo, name: label, color:
          meta.color, description: meta.description });\n}\n\n// Apply label\nawait
          github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo,
          issue_number: context.payload.issue.number, labels: [label] });\n"
    - name: Comment on issue
      if: steps.process.outputs.should_comment == 'true'
      uses: actions/github-script@v9
      env:
        COMMENT_BODY: ${{ steps.process.outputs.comment_body }}
      with:
        script: "await github.rest.issues.createComment({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: context.payload.issue.number,\n\
          \  body: process.env.COMMENT_BODY\n});\n"
